<svg xmlns="http://www.w3.org/2000/svg" width="412" height="214" viewBox="0 0 412 214" role="img" aria-label="cub3D — Wolfenstein-style raycasting engine: DDA, textured walls, doors, sprites, minimap and flood-fill map validation.">
