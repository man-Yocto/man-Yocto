<text x="22" y="90" class="sans" font-size="13" fill="#8b98a9">AI-powered competitive-programming coach whose learning</text>
<text x="22" y="109" class="sans" font-size="13" fill="#8b98a9">roadmaps adapt to each user's behaviour, hesitation and</text>
