<svg xmlns="http://www.w3.org/2000/svg" width="412" height="214" viewBox="0 0 412 214" role="img" aria-label="CodeForces Coach — AI-powered competitive-programming coach whose learning roadmaps adapt to each user's behaviour, hesitation and error patterns. Progressive hints, cheat detection, live Codeforces data.">
<title>CodeForces Coach — AI-powered competitive-programming coach whose learning roadmaps adapt to each user's behaviour, hesitation and error patterns. Progressive hints, cheat detection, live Codeforces data.</title>
<style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.fade{opacity:0;animation:fade .7s ease-out forwards}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.cursor{animation:blink 1.05s step-end infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
.accent{opacity:0;animation:fade .5s 0.5s forwards}</style>
<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><g class="rise" style="animation-delay:0.0s"><rect x=".5" y=".5" width="411" height="213" rx="12" fill="#0a0e14" stroke="#1f2a37"/>
<text x="22" y="34" class="mono" font-size="11" letter-spacing="1.2" fill="#4f5d6e">AI PLATFORM · SOLVEX</text>
<text x="22" y="64" class="sans" font-size="20" font-weight="700" fill="#e6edf3">CodeForces Coach</text>
