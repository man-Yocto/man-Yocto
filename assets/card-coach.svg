<rect x="22" y="180" width="50" height="20" rx="4" fill="#0f1621" stroke="#1f2a37"/><text x="47" y="194" text-anchor="middle" class="mono" font-size="11" fill="#5ac8fa">React</text>
<rect x="78" y="180" width="64" height="20" rx="4" fill="#0f1621" stroke="#1f2a37"/><text x="111" y="194" text-anchor="middle" class="mono" font-size="11" fill="#5ac8fa">Express</text>
<rect x="149" y="180" width="85" height="20" rx="4" fill="#0f1621" stroke="#1f2a37"/><text x="191" y="194" text-anchor="middle" class="mono" font-size="11" fill="#5ac8fa">PostgreSQL</text>
<rect x="240" y="180" width="50" height="20" rx="4" fill="#0f1621" stroke="#1f2a37"/><text x="265" y="194" text-anchor="middle" class="mono" font-size="11" fill="#5ac8fa">Redis</text>
