<svg xmlns="http://www.w3.org/2000/svg" width="840" height="64" viewBox="0 0 840 64" role="img" aria-label="always compiling. let it rip.">
<title>always compiling. let it rip.</title>
<style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.fade{opacity:0;animation:fade .7s ease-out forwards}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.cursor{animation:blink 1.05s step-end infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
@media (prefers-color-scheme:light){.tt{fill:#1f2328}.ts{fill:#59636e}.rl{fill:#d0d7de}}</style>
<text x="420" y="38" text-anchor="middle" class="mono fade" font-size="14"><tspan fill="#7ee787">$</tspan><tspan class="ts" fill="#8b98a9"> make re &amp;&amp; ./always_compiling</tspan><tspan fill="#5ac8fa"> — let it rip.</tspan><tspan class="cursor" fill="#5ac8fa"> ▍</tspan></text>
</svg>
