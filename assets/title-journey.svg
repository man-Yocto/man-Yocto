<svg xmlns="http://www.w3.org/2000/svg" width="840" height="74" viewBox="0 0 840 74" role="img" aria-label="03 Experience &amp; education">
<title>03 Experience &amp; education</title>
<style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.fade{opacity:0;animation:fade .7s ease-out forwards}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.cursor{animation:blink 1.05s step-end infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
.rule{opacity:0;animation:fade .6s .2s forwards}.sweep{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .9s .35s cubic-bezier(.4,0,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}@media (prefers-color-scheme:light){.tt{fill:#1f2328}.ts{fill:#59636e}.rl{fill:#d0d7de}}</style>
<g class="rise">
<text x="2" y="30" class="mono" font-size="13" fill="#5ac8fa">03</text>
<text x="34" y="31" class="sans tt" font-size="24" font-weight="700" fill="#e6edf3">Experience &amp; education</text>
<text x="34" y="56" class="sans ts" font-size="14" fill="#8b98a9">Where the hours went.</text>
</g>
<rect class="rule rl" x="2" y="71" width="836" height="1" fill="#1f2a37"/>
<rect class="sweep" x="2" y="70" width="48" height="2" fill="url(#g)"/>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
</svg>
