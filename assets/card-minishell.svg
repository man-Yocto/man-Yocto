<svg xmlns="http://www.w3.org/2000/svg" width="412" height="214" viewBox="0 0 412 214" role="img" aria-label="minishell — A Bash-like shell from zero in C: tokenizer, quotes, pipes, every redirection, heredocs, $VAR expansion, signals and built-ins.">
<title>minishell — A Bash-like shell from zero in C: tokenizer, quotes, pipes, every redirection, heredocs, $VAR expansion, signals and built-ins.</title>
<style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.fade{opacity:0;animation:fade .7s ease-out forwards}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.cursor{animation:blink 1.05s step-end infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
.accent{opacity:0;animation:fade .5s 0.65s forwards}</style>
