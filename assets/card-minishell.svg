<text x="22" y="64" class="sans" font-size="20" font-weight="700" fill="#e8e4dc">minishell</text>
<text x="22" y="90" class="sans" font-size="13" fill="#8b9296">A Bash-like shell from zero in C: tokenizer, quotes,</text>
<text x="22" y="109" class="sans" font-size="13" fill="#8b9296">pipes, every redirection, heredocs, $VAR expansion,</text>
