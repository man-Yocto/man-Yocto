<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><g class="rise" style="animation-delay:0.15s"><rect x=".5" y=".5" width="411" height="213" rx="12" fill="#0a0e14" stroke="#1f2a37"/>
