<svg xmlns="http://www.w3.org/2000/svg" width="412" height="214" viewBox="0 0 412 214" role="img" aria-label="minishell — A Bash-like shell from zero in C: tokenizer, quotes, pipes, every redirection, heredocs, $VAR expansion, signals and built-ins.">
<title>minishell — A Bash-like shell from zero in C: tokenizer, quotes, pipes, every redirection, heredocs, $VAR expansion, signals and built-ins.</title>
<style>
