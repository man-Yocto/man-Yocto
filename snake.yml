name: 🐍 Generate Snake Animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
concurrency:
  group: snake-animation
  cancel-in-progress: true
jobs:
  generate:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235AC8FA&color_dots=%23ebedf0,%238ecae6,%235AC8FA,%232a9df4,%230A0E14
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%235AC8FA&color_dots=%23161b22,%231B2430,%232a9df4,%235AC8FA,%23F0F6FC
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
